<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Shelf</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8E%9E%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/app.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Shelf" />
  </head>
  <body>
    <div class="shell">
      <aside class="side" id="side" aria-label="Folders">
        <div class="sidehead">
          <button class="brand" id="home" title="Show everything">
            <span class="mark" data-icon="library" aria-hidden="true"></span
            >Shelf
          </button>
          <button
            class="iconbtn narrow-only"
            id="sideclose"
            aria-label="Close folders"
          >
            <span data-icon="close"></span>
          </button>
        </div>
        <div class="search">
          <span class="search-icon" data-icon="search"></span>
          <input
            id="q"
            type="search"
            placeholder="Search library"
            aria-label="Search file names and folders"
          />
          <kbd id="searchkey" aria-hidden="true">⌘ K</kbd>
        </div>
        <nav class="tree" id="tree" aria-label="Folder tree"></nav>
        <div class="sidefoot">
          <div class="sidelinks" id="sidelinks"></div>
          <div class="sidestatus" id="sidestatus"></div>
        </div>
      </aside>
      <div class="backdrop" id="backdrop" hidden></div>

      <main>
        <div class="workspacebar">
          <header class="top">
            <button
              class="iconbtn narrow-only"
              id="menubtn"
              aria-label="Open folders"
              aria-controls="side"
              aria-expanded="false"
            >
              <span data-icon="menu"></span>
            </button>
            <div class="pageheading">
              <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
              <h1 id="pagetitle" class="sr-only">Your library</h1>
            </div>
          </header>

          <div class="bar">
            <div
              class="tabs"
              role="group"
              aria-label="Filter by kind"
              id="tabs"
            ></div>
            <div class="barright">
              <span id="mchip" class="chip" hidden>
                <span id="monthlabel"></span
                ><button
                  title="Clear month filter"
                  aria-label="Clear month filter"
                >
                  <span data-icon="close"></span>
                </button>
              </span>
              <button class="refresh" id="refresh" hidden>
                <span data-icon="refresh"></span><span>Refresh library</span>
              </button>
              <span
                id="count"
                role="status"
                aria-live="polite"
                aria-atomic="true"
              ></span>
              <span class="selwrap">
                <span class="sort-icon" data-icon="sort"></span>
                <select id="sort" aria-label="Sort order">
                  <option value="newest">Newest file date</option>
                  <option value="oldest">Oldest file date</option>
                  <option value="added">Recently indexed</option>
                  <option value="name">Name</option>
                  <option value="largest">Largest first</option>
                  <option value="longest">Longest video</option>
                  <option value="shortest">Shortest video</option>
                </select>
              </span>
              <div class="density" role="group" aria-label="Grid density">
                <button
                  id="comfortable"
                  class="iconbtn"
                  aria-label="Comfortable grid"
                  aria-pressed="true"
                  title="Comfortable grid"
                >
                  <span data-icon="grid"></span>
                </button>
                <button
                  id="compact"
                  class="iconbtn"
                  aria-label="Compact grid"
                  aria-pressed="false"
                  title="Compact grid"
                >
                  <span data-icon="compact"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div id="ixstrip" hidden>
          <div class="dlhead">
            <span class="scan-label"
              ><span data-icon="refresh"></span><span id="ixtext"></span
            ></span>
            <span id="ixpct"></span>
          </div>
          <div class="dltrack"><div class="dlbar" id="ixbar"></div></div>
        </div>
        <div id="grid"></div>
        <div class="sentinel" id="more" hidden aria-hidden="true">
          <span class="loading-dot"></span>Loading more…
        </div>
        <section id="subpage" hidden></section>
      </main>
    </div>

    <div id="lb" role="dialog" aria-modal="true" aria-label="File detail">
      <button class="lb-close" id="lbclose" aria-label="Close">
        <span data-icon="close"></span>
      </button>
      <button class="lb-nav prev" id="lbprev" aria-label="Previous">
        <span data-icon="arrowLeft"></span>
      </button>
      <button class="lb-nav next" id="lbnext" aria-label="Next">
        <span data-icon="arrowRight"></span>
      </button>
      <div class="lb-panel">
        <div class="lb-media" id="lbmedia"></div>
        <div class="lb-feed" id="lbfeed" hidden></div>
        <div class="lb-jump" id="lbjump" aria-hidden="true"></div>
        <div class="lb-pause" data-icon="play" aria-hidden="true"></div>
        <div class="lb-bar" id="lbbar" aria-hidden="true">
          <span id="lbbarfill"></span>
        </div>
        <div class="lb-side">
          <div class="lb-progress" id="lbctl">
            <button id="lbplay" type="button" aria-label="Pause">
              <span data-icon="pause"></span>
            </button>
            <span class="lbtime" id="lbat">0:00</span>
            <div class="lbtrack" id="lbseek">
              <span class="lbrail"
                ><span class="lbfill" id="lbfill"></span
              ></span>
            </div>
            <span class="lbtime" id="lbdur">0:00</span>
            <button id="lbmute" type="button" aria-label="Mute">
              <span data-icon="volume"></span>
            </button>
          </div>
          <div class="lb-author">
            <span class="avatar" id="lbavatar"></span>
            <span class="who">
              <b id="lbname"></b>
              <span id="lbhandle" title="Show this folder"></span>
            </span>
          </div>
          <p class="lb-text" id="lbdetails"></p>
          <a
            class="lb-date"
            id="lbdate"
            href="#"
            target="_blank"
            rel="noopener"
            title="Open the file"
          ></a>
          <div class="lb-actions" id="lbactions">
            <button id="lbfilter">
              <span data-icon="folder"></span>More from this folder
            </button>
            <button id="lbreveal">
              <span data-icon="external"></span>Reveal in Finder
            </button>
            <button
              class="iconbtn"
              id="lbremove"
              title="Delete file"
              aria-label="Delete file"
            >
              <span data-icon="trash"></span>
            </button>
          </div>
          <div class="lb-actions lb-confirm" id="lbconfirm" hidden>
            <div class="crow chead">
              <span class="cq">Delete this file from disk?</span>
              <button class="quiet" id="lbcancel">Cancel</button>
            </div>
            <div class="crow">
              <button class="danger" id="lbdelete">Delete file</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
