<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Shelf</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8E%9E%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/app.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shelf" />
  </head>
  <body>
    <div class="shell">
      <aside class="side" id="side" aria-label="Folders">
        <div class="sidehead">
          <button class="brand" id="home" title="Show everything">
            <span class="mark" aria-hidden="true"></span>Shelf
          </button>
          <button class="iconbtn narrow-only" id="sideclose" aria-label="Close folders">
            ✕
          </button>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
          <input
            id="q"
            type="search"
            placeholder="Search"
            aria-label="Search file names and folders"
          />
        </div>
        <nav class="tree" id="tree" aria-label="Folder tree"></nav>
        <div class="sidefoot">
          <div class="sidelinks" id="sidelinks"></div>
          <div class="sidestatus" id="sidestatus"></div>
        </div>
      </aside>
      <div class="backdrop" id="backdrop" hidden></div>

      <main>
        <header class="top">
          <button class="iconbtn narrow-only" id="menubtn" aria-label="Open folders">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2 4h12M2 8h12M2 12h12" />
            </svg>
          </button>
          <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
          <span class="selwrap">
            <select id="sort" aria-label="Sort order">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="added">Recently indexed</option>
              <option value="name">Name</option>
              <option value="largest">Largest</option>
              <option value="longest">Longest video</option>
              <option value="shortest">Shortest video</option>
            </select>
          </span>
        </header>

        <div id="ixstrip" hidden>
          <div class="dlhead">
            <span id="ixtext"></span>
            <span id="ixpct"></span>
          </div>
          <div class="dltrack"><div class="dlbar" id="ixbar"></div></div>
        </div>

        <div class="bar">
          <div class="tabs" role="group" aria-label="Filter by kind" id="tabs"></div>
          <div class="barright">
            <span id="mchip" class="chip" hidden>
              <span></span
              ><button title="Clear month filter" aria-label="Clear month filter">
                ×
              </button>
            </span>
            <button class="refresh" id="refresh" hidden>
              Library changed · refresh
            </button>
            <span id="count"></span>
          </div>
        </div>
        <div id="grid"></div>
        <div class="sentinel" id="more" hidden aria-hidden="true">
          Loading more…
        </div>
        <section id="subpage" hidden></section>
      </main>
    </div>

    <div id="lb" role="dialog" aria-modal="true" aria-label="File detail">
      <button class="lb-close" id="lbclose" aria-label="Close">✕</button>
      <button class="lb-nav prev" id="lbprev" aria-label="Previous">←</button>
      <button class="lb-nav next" id="lbnext" aria-label="Next">→</button>
      <div class="lb-panel">
        <div class="lb-media" id="lbmedia"></div>
        <div class="lb-feed" id="lbfeed" hidden></div>
        <div class="lb-jump" id="lbjump" aria-hidden="true"></div>
        <div class="lb-pause" aria-hidden="true">▶</div>
        <div class="lb-bar" id="lbbar" aria-hidden="true">
          <span id="lbbarfill"></span>
        </div>
        <div class="lb-side">
          <div class="lb-progress" id="lbctl">
            <button id="lbplay" type="button" aria-label="Pause">❚❚</button>
            <span class="lbtime" id="lbat">0:00</span>
            <div class="lbtrack" id="lbseek">
              <span class="lbrail"><span class="lbfill" id="lbfill"></span></span>
            </div>
            <span class="lbtime" id="lbdur">0:00</span>
            <button id="lbmute" type="button" aria-label="Mute">
              <svg viewBox="0 0 12 12" aria-hidden="true">
                <path d="M1.2 4.2h2.2l3.2-2.6v8.8L3.4 7.8H1.2Z" />
                <path class="wave" d="M8.4 3.7a3.1 3.1 0 0 1 0 4.6" />
                <path class="slash" d="m8.2 4.4 3 3.2m0-3.2-3 3.2" />
              </svg>
            </button>
          </div>
          <div class="lb-author">
            <span class="avatar" id="lbavatar"></span>
            <span class="who">
              <b id="lbname"></b>
              <span id="lbhandle" title="Show this folder"></span>
            </span>
          </div>
          <p class="lb-text" id="lbdetails"></p>
          <a
            class="lb-date"
            id="lbdate"
            href="#"
            target="_blank"
            rel="noopener"
            title="Open the file"
          ></a>
          <div class="lb-actions" id="lbactions">
            <button id="lbfilter">More from this folder</button>
            <button id="lbreveal">Reveal in Finder</button>
            <button
              class="iconbtn"
              id="lbremove"
              title="Delete file"
              aria-label="Delete file"
            >
              <svg
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path
                  d="M2.5 4h11M6.5 4V2.5h3V4M4 4l.7 9.2a1 1 0 0 0 1 .8h4.6a1 1 0 0 0 1-.8L12 4M6.5 7v4M9.5 7v4"
                ></path>
              </svg>
            </button>
          </div>
          <div class="lb-actions lb-confirm" id="lbconfirm" hidden>
            <div class="crow chead">
              <span class="cq">Delete this file from disk?</span>
              <button class="quiet" id="lbcancel">Cancel</button>
            </div>
            <div class="crow">
              <button class="danger" id="lbdelete">Delete file</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
